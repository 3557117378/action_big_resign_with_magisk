name: resign_v3

on:
  workflow_dispatch:
    inputs:
      ZIP_URL:
        description: 'URL of (splloader)+uboot+sml+trustos+(teecfg)+vbmeta+boot+(recovery) (all end with .bin)'
        required: true
        default: ''
      EXTRA_KEY_TREE_URL:
        description: 'EXTRA_KEY_TREE_URL (leave blank if you only use unisoc keys)'
        required: false
      EXTRA_KEY_BRANCH:
        description: 'EXTRA_KEY_BRANCH (leave blank if you only use unisoc keys)'
        required: false
      antiroll:
        description: 'anti-rollback version (trusted_version) for BSP signing'
        required: false
        default: '0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: main
        path: main

    - name: Setup SSH Keys
      if: ${{ startsWith(github.event.inputs.EXTRA_KEY_TREE_URL, 'git@github.com') }}
      uses: webfactory/ssh-agent@v0.10.0
      with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Clone extra keys
      if: |
        github.event.inputs.EXTRA_KEY_TREE_URL != null
        && github.event.inputs.EXTRA_KEY_BRANCH != null
      run: |
        git clone ${{ github.event.inputs.EXTRA_KEY_TREE_URL }} -b ${{ github.event.inputs.EXTRA_KEY_BRANCH }} ./extra_key

    - name: patch
      env:
        ANTIROLL: "${{ github.event.inputs.antiroll }}"
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # 统一健壮下载：重试+超时+HTTP错误码立即失败+下完自检
        dl() {
          local url="$1" out="$2"
          echo ">> 下载 ${out}: ${url}"
          curl -fsSL --retry 5 --retry-delay 3 --retry-connrefused \
               --connect-timeout 15 --max-time 600 \
               -o "${out}" "${url}"
          file "${out}"
        }

        sudo apt update
        sudo apt -y install build-essential openssl curl wget busybox xz-utils python3 jq

        chmod +x main/setup-7zz.sh
        ./main/setup-7zz.sh

        # build avbctl
        make -C main/avbctl

        dl "${{ github.event.inputs.ZIP_URL }}" original.zip
        unzip -t original.zip >/dev/null   # 确认拿到的是完整 zip 而非错误页

        # ===== 修复点：Magisk APK 地址提取 =====
        # 根因：releases API 里同一个 tag 下有 app-debug.apk 和 Magisk-vX.Y.apk 两个
        # asset，旧写法把它们全抓下来拼成一个多行字符串喂给 curl，curl 报
        # (3) URL rejected: Malformed input to a URL function (exit code 3)。
        # 修法：用 jq 只取"正式发布包 Magisk-v*.apk"，head -n1 保证单行干净 URL。
        MAGISK_URL=$(curl -fsSL --retry 5 --connect-timeout 15 --max-time 120 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/topjohnwu/Magisk/releases/latest" \
          | jq -r '.assets[].browser_download_url' \
          | grep -E '/Magisk-v[0-9][^/]*\.apk$' \
          | head -n1)

        if [ -z "${MAGISK_URL}" ]; then
          echo "!! 没能解析到 Magisk 正式 APK 下载地址" >&2
          exit 1
        fi
        echo ">> 解析到 Magisk APK: ${MAGISK_URL}"

        dl "${MAGISK_URL}" magisk.apk

        wget https://raw.githubusercontent.com/magojohnji/magiskboot-linux/main/x86_64/magiskboot
        chmod +x magiskboot
        chmod +x main/*.sh
        mv main/sign_v3.sh ./
        if ! [[ "$ANTIROLL" =~ ^[0-9]+$ ]]; then echo "antiroll must be a non-negative integer"; exit 1; fi
        sed -i "s/trusted_version=.*/trusted_version=$ANTIROLL/" main/config/version.cfg
        ./sign_v3.sh

    - name: Upload to Release
      uses: softprops/action-gh-release@v3
      with:
        files: |
          resigned.zip
        name: ${{ github.run_id }}
        tag_name: ${{ github.run_id }}
        body: |
          URL: ${{ github.event.inputs.ZIP_URL }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
